<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Fin de la transmisión. Eliot Calderón Romero, Jada Robotics."><title>Fin de la transmisión. Eliot Calderón Romero, Jada Robotics.</title><defs><style>
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace}.d{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(130px)}}
@keyframes g1{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-5px,1px)}91%{transform:translate(4px,-1px)}94%{transform:translate(-2px,0)}}
@keyframes g2{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(5px,-1px)}91%{transform:translate(-4px,1px)}94%{transform:translate(2px,0)}}
.bl{animation:blink 1s steps(1) infinite}
.r{animation:fi .6s ease-out backwards}
.fl{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.g1{animation:g1 5s infinite}.g2{animation:g2 5s infinite}
.sc{animation:scan 6s linear infinite}
</style><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00F0FF" stroke-opacity=".06"/></pattern></defs><rect width="1000" height="130" fill="#0A0A0F"/><rect width="1000" height="130" fill="url(#g)"/><polygon points="2.0,2.0 976.0,2.0 998.0,24.0 998.0,128.0 24.0,128.0 2.0,106.0" fill="#11111B" fill-opacity=".85" stroke="#FCEE0A" stroke-width="2"/><text class="d g1" x="40" y="68" font-size="38" fill="#FF003C" fill-opacity="0.85" textLength="470" lengthAdjust="spacingAndGlyphs">FIN DE LA TRANSMISIÓN</text><text class="d g2" x="40" y="68" font-size="38" fill="#00F0FF" fill-opacity="0.85" textLength="470" lengthAdjust="spacingAndGlyphs">FIN DE LA TRANSMISIÓN</text><text class="d " x="40" y="68" font-size="38" fill="#FCEE0A" fill-opacity="1" textLength="470" lengthAdjust="spacingAndGlyphs">FIN DE LA TRANSMISIÓN</text><text class="m" x="40" y="100" font-size="14" fill="#8B90A8">// conexión cerrada  ·  Eliot Calderón Romero  ·  Jada Robotics</text><rect class="bl" x="640" y="86" width="10" height="16" fill="#FCEE0A"/></svg>