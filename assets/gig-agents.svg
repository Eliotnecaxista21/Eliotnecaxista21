<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="CYBERPHYSICAL AGENTS. Arquitecturas de agentes de IA con enfoque ciberfísico: normalización de entradas ruidosas, ruteo SLM a LLM por costo, flujos deterministas con LangGraph y herramientas externas a través de MCP."><title>CYBERPHYSICAL AGENTS. Arquitecturas de agentes de IA con enfoque ciberfísico: normalización de entradas ruidosas, ruteo SLM a LLM por costo, flujos deterministas con LangGraph y herramientas externas a través de MCP.</title><defs><style>
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace}.d{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(206px)}}
@keyframes g1{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-5px,1px)}91%{transform:translate(4px,-1px)}94%{transform:translate(-2px,0)}}
@keyframes g2{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(5px,-1px)}91%{transform:translate(-4px,1px)}94%{transform:translate(2px,0)}}
.bl{animation:blink 1s steps(1) infinite}
.r{animation:fi .6s ease-out backwards}
.fl{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.g1{animation:g1 5s infinite}.g2{animation:g2 5s infinite}
.sc{animation:scan 6s linear infinite}
