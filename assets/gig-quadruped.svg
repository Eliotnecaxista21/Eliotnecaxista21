<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 206" width="1000" height="206" role="img" aria-label="PERRO ROBÓTICO CUADRÚPEDO. Perro robótico cuadrúpedo operado con un control de Xbox sobre un ESP32, con simulación en ROS 2 Humble visualizada en RViz2."><title>PERRO ROBÓTICO CUADRÚPEDO. Perro robótico cuadrúpedo operado con un control de Xbox sobre un ESP32, con simulación en ROS 2 Humble visualizada en RViz2.</title><defs><style>
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace}.d{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(206px)}}
@keyframes g1{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-5px,1px)}91%{transform:translate(4px,-1px)}94%{transform:translate(-2px,0)}}
@keyframes g2{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(5px,-1px)}91%{transform:translate(-4px,1px)}94%{transform:translate(2px,0)}}
.bl{animation:blink 1s steps(1) infinite}
.r{animation:fi .6s ease-out backwards}
.fl{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.g1{animation:g1 5s infinite}.g2{animation:g2 5s infinite}
.sc{animation:scan 6s linear infinite}
</style><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00F0FF" stroke-opacity=".06"/></pattern></defs><rect width="1000" height="206" fill="#0A0A0F"/><rect width="1000" height="206" fill="url(#g)"/><polygon points="2.0,2.0 974.0,2.0 998.0,26.0 998.0,204.0 26.0,204.0 2.0,180.0" fill="#11111B" fill-opacity=".85" stroke="#00F0FF" stroke-width="2"/><rect x="2" y="40" width="8" height="126" fill="#00F0FF"/><text class="m" x="36" y="36" font-size="12" fill="#FF003C" letter-spacing="3">// GIG 02</text><text class="d" x="36" y="78" font-size="34" fill="#ECECF2" letter-spacing="2">PERRO ROBÓTICO CUADRÚPEDO</text><text class="m" x="36" y="108" font-size="14" fill="#8B90A8">Perro robótico cuadrúpedo operado con un control de Xbox sobre un ESP32,</text><text class="m" x="36" y="128" font-size="14" fill="#8B90A8">con simulación en ROS 2 Humble visualizada en RViz2.</text><polygon points="36.0,166.0 90.0,166.0 96.0,172.0 96.0,190.0 42.0,190.0 36.0,184.0" fill="#00F0FF" fill-opacity=".1" stroke="#00F0FF" stroke-width="1.2"/><text class="m" x="66.0" y="182" font-size="12" fill="#ECECF2" text-anchor="middle">ESP32</text><polygon points="104.0,166.0 208.4,166.0 214.4,172.0 214.4,190.0 110.0,190.0 104.0,184.0" fill="#00F0FF" fill-opacity=".1" stroke="#00F0FF" stroke-width="1.2"/><text class="m" x="159.2" y="182" font-size="12" fill="#ECECF2" text-anchor="middle">ROS 2 Humble</text><polygon points="222.4,166.0 276.4,166.0 282.4,172.0 282.4,190.0 228.4,190.0 222.4,184.0" fill="#00F0FF" fill-opacity=".1" stroke="#00F0FF" stroke-width="1.2"/><text class="m" x="252.4" y="182" font-size="12" fill="#ECECF2" text-anchor="middle">RViz2</text><polygon points="290.4,166.0 394.8,166.0 400.8,172.0 400.8,190.0 296.4,190.0 290.4,184.0" fill="#00F0FF" fill-opacity=".1" stroke="#00F0FF" stroke-width="1.2"/><text class="m" x="345.6" y="182" font-size="12" fill="#ECECF2" text-anchor="middle">Control Xbox</text></svg>