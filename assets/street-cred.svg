<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Reconocimientos: primer lugar mundial en el Huawei ICT Competition 2025-2026 en Shenzhen, con 33 países participantes; finalista global (Stage 3) del Intel AI Global Impact Festival 2026. Proyecto: Plague-Bot VR."><title>Reconocimientos: primer lugar mundial en el Huawei ICT Competition 2025-2026 en Shenzhen, con 33 países participantes; finalista global (Stage 3) del Intel AI Global Impact Festival 2026. Proyecto: Plague-Bot VR.</title><defs><style>
.m{font-family:'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace}.d{font-family:Impact,'Haettenschweiler','Arial Narrow Bold','Arial Black',sans-serif}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes fi{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes scan{from{transform:translateY(-6px)}to{transform:translateY(190px)}}
@keyframes g1{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(-5px,1px)}91%{transform:translate(4px,-1px)}94%{transform:translate(-2px,0)}}
@keyframes g2{0%,86%,100%{transform:translate(0,0)}88%{transform:translate(5px,-1px)}91%{transform:translate(-4px,1px)}94%{transform:translate(2px,0)}}
.bl{animation:blink 1s steps(1) infinite}
.r{animation:fi .6s ease-out backwards}
.fl{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}
.g1{animation:g1 5s infinite}.g2{animation:g2 5s infinite}
.sc{animation:scan 6s linear infinite}
</style><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#00F0FF" stroke-opacity=".06"/></pattern></defs><rect width="1000" height="190" fill="#0A0A0F"/><rect width="1000" height="190" fill="url(#g)"/><polygon points="6.0,2.0 470.0,2.0 492.0,24.0 492.0,188.0 28.0,188.0 6.0,166.0" fill="#11111B" fill-opacity=".85" stroke="#FCEE0A" stroke-width="2"/><text class="m" x="34" y="34" font-size="12" fill="#FF003C" letter-spacing="3">// RECONOCIMIENTO 01</text><text class="d" x="32" y="128" font-size="88" fill="#FCEE0A" textLength="104" lengthAdjust="spacingAndGlyphs">#1</text><text class="d" x="156" y="80" font-size="27" fill="#ECECF2" textLength="280" lengthAdjust="spacingAndGlyphs">PRIMER LUGAR MUNDIAL</text><text class="m" x="156" y="108" font-size="14" fill="#00F0FF">Huawei ICT Competition 2025-2026</text><text class="m" x="156" y="132" font-size="13" fill="#8B90A8">Shenzhen, China  ·  33 países</text><text class="m" x="156" y="156" font-size="13" fill="#8B90A8">Proyecto: Plague-Bot VR</text><polygon points="508.0,2.0 972.0,2.0 994.0,24.0 994.0,188.0 530.0,188.0 508.0,166.0" fill="#11111B" fill-opacity=".85" stroke="#00F0FF" stroke-width="2"/><text class="m" x="536" y="34" font-size="12" fill="#FF003C" letter-spacing="3">// RECONOCIMIENTO 02</text><text class="d" x="534" y="128" font-size="88" fill="#00F0FF" textLength="104" lengthAdjust="spacingAndGlyphs">S3</text><text class="d" x="658" y="80" font-size="27" fill="#ECECF2" textLength="224" lengthAdjust="spacingAndGlyphs">FINALISTA GLOBAL</text><text class="m" x="658" y="108" font-size="14" fill="#00F0FF">Intel AI Global Impact Festival</text><text class="m" x="658" y="132" font-size="13" fill="#8B90A8">Edición 2026  ·  Stage 3</text><text class="m" x="658" y="156" font-size="13" fill="#8B90A8">Proyecto: Plague-Bot VR</text></svg>